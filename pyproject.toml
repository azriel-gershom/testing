[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-test"
version = "0.1.0"
description = "A controlled target repository for testing AI Software Engineering Agents."
authors = [{name = "Test Author"}]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."

[tool.setuptools]
py-modules = ["calculator", "app"]

